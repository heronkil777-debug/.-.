name: APK Android

on:
  push:
    branches: [main]
    paths: ["www/**", "capacitor.config.json", "package.json", ".github/workflows/android.yml"]
  workflow_dispatch:

jobs:
  apk:
    name: Gerar APK (debug)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Aceitar licenças do SDK
        run: yes | sdkmanager --licenses > /dev/null || true

      - name: Instalar dependências
        run: npm ci

      - name: Adicionar plataforma Android
        run: npx cap add android

      - name: Copiar o jogo para o projeto Android
        run: npx cap sync android

      - name: Compilar APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Publicar APK como artefato
        uses: actions/upload-artifact@v4
        with:
          name: stop-jogo-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Resumo
        run: |
          echo "### 📱 APK pronto" >> $GITHUB_STEP_SUMMARY
          echo "Baixe em **Artifacts → stop-jogo-apk**." >> $GITHUB_STEP_SUMMARY
          echo "No celular: permita 'instalar apps desconhecidos' e abra o arquivo." >> $GITHUB_STEP_SUMMARY
